    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            background: #05090c;
            color: #e9fff7;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        .section-title {
            font-size: 36px;
            font-weight: 700;
            color: #00ffc8;
            text-shadow: 0 0 8px #00ffc8;
        }

        .screenshot-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 200, 0.18);
            border-radius: 14px;
            backdrop-filter: blur(12px);
            padding: 12px;
            transition: .3s;
            cursor: pointer;
        }

        .screenshot-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 20px #00ffc836;
        }

        .screenshot-card img {
            width: 100%;
            border-radius: 10px;
        }

         .modal-dialog {
            max-width: 70% !important; /* wider modal */
        }

        /* Modal image size */
        .modal-img {
            width: 100%;
            border-radius: 10px;
        }

        /* Glow button */
        .glow-btn {
            border: 2px solid #00ffc8;
            color: #00ffc8;
            padding: 10px 28px;
            border-radius: 8px;
            transition: .3s;
        }

        .glow-btn:hover {
            background: #00ffc8;
            color: black;
            box-shadow: 0 0 18px #00ffc8;
        }

    </style>
</head>

    <script>
